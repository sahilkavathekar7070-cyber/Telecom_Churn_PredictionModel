# Central configuration: edit this instead of touching code.
data:
  path: data/raw/churn.csv        # CSV used for training
  target: Churn                # name of the label column
  test_size: 0.3               #  if test_size  0.3 i.e train_size = 0.7     
  random_state: 1

model:
  type: random_forest           # random_forest | logistic_regression
  params:
    n_estimators: 100
    max_depth: None

artifacts:
  model_dir: models             # versioned models are saved here
  report_dir: reports           # metrics JSON files are saved here
